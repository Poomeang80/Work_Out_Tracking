<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Iron Home – Muscle Gain Tracker</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">

<style>

:root{--bg:#f3f5f4;--card:#fff;--ink:#14191c;--mute:#667078;--line:#e1e6e4;--g:#12b34a;--gs:#dff6e7;--b:#2563eb;--warn:#fff4d6;--warnink:#6b4a00;color-scheme:light}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--card:#1f2427;--ink:#eef2f0;--mute:#98a3a0;--line:#2d3438;--g:#3dff7a;--gs:#17331f;--b:#5b8dff;--warn:#3a3012;--warnink:#f3d98a;color-scheme:dark}}

:root[data-theme="dark"]{--bg:#15181a;--card:#1f2427;--ink:#eef2f0;--mute:#98a3a0;--line:#2d3438;--g:#3dff7a;--gs:#17331f;--b:#5b8dff;--warn:#3a3012;--warnink:#f3d98a;color-scheme:dark}

*{box-sizing:border-box}

html,body{height:100%;margin:0}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{background:var(--bg);color:var(--ink);font:400 15px/1.5 Barlow,system-ui,sans-serif;display:flex;flex-direction:column-reverse}

h1,h2,h3,.num{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}

nav{display:flex;background:var(--card);border-top:1px solid var(--line);position:sticky;bottom:0;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}

nav button{flex:1;background:none;border:0;color:var(--mute);padding:9px 2px 8px;font:500 11px Barlow,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}

nav button svg{width:22px;height:22px}

nav button.on{color:var(--g)}

nav .brand,nav .desk{display:none}

main{flex:1;padding:16px 16px 24px;max-width:960px;width:100%;margin:0 auto;overflow-x:hidden}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

h1{font-size:30px}

h2{font-size:22px;margin-bottom:8px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}

.knee{background:var(--warn);color:var(--warnink);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}

.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}

.stat small{color:var(--mute);font-size:12px}

.stat .num{font-size:28px;display:block;line-height:1.1}

.stat .num.g{color:var(--g)}

.btn{background:var(--g);color:#06210f;border:0;border-radius:12px;padding:11px 16px;font:600 15px Barlow,sans-serif;cursor:pointer}

.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}

.btn:focus-visible,nav button:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--b);outline-offset:2px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

.chip{border:1px solid var(--line);background:none;color:var(--mute);border-radius:99px;padding:5px 12px;font:500 13px Barlow,sans-serif;cursor:pointer}

.chip.on{background:var(--g);color:#06210f;border-color:var(--g)}

.ex{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line)}

.ex:first-of-type{border-top:0}

.ex span{color:var(--mute)}

svg.chart{width:100%;height:auto;display:block}

select,input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 8px;font:500 14px Barlow,sans-serif}

input[type=number]{width:58px}

input.name{width:100%}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.tag{display:inline-block;background:var(--gs);color:var(--g);border-radius:8px;padding:1px 8px;font-size:12px;font-weight:600}

details{border-top:1px solid var(--line);padding:10px 0}

details:first-of-type{border-top:0}

summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;list-style:none}

summary::-webkit-details-marker{display:none}

details p{margin:6px 0 0;color:var(--mute)}

details b{color:var(--ink)}

.lock{border:1.5px dashed var(--line);border-radius:14px;padding:12px;color:var(--mute);font-size:14px}

.empty{text-align:center;padding:28px 8px;color:var(--mute)}

.empty h2{color:var(--ink)}

@media(min-width:800px){

body{flex-direction:row}

nav{position:sticky;top:0;height:100vh;flex-direction:column;width:220px;border-top:0;border-right:1px solid var(--line);padding:20px 12px;gap:4px}

nav .brand{display:block;font:700 26px "Barlow Condensed",sans-serif;color:var(--g);padding:0 10px 14px}

nav button{flex:none;flex-direction:row;font-size:15px;gap:12px;padding:10px;border-radius:12px;justify-content:flex-start}

nav button.on{background:var(--gs)}

nav .desk{display:block;margin-top:auto}

main{padding:28px 32px}

.grid{grid-template-columns:repeat(3,1fr)}

}

@media(prefers-reduced-motion:no-preference){main>*{animation:in .25s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}


.exercise-thumb{width:58px;height:58px;border-radius:12px;object-fit:cover;background:var(--bg);border:1px solid var(--line);flex:0 0 auto}
.exercise-hero{width:180px;max-width:42vw;height:180px;object-fit:cover;border-radius:14px;background:var(--bg);border:1px solid var(--line);float:right;margin:0 0 10px 12px}
.library-controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
.library-controls input,.library-controls select{width:100%}
.sync-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--mute);margin-right:6px}
.sync-dot.on{background:var(--g)}
.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.notice{font-size:13px;color:var(--mute);margin:6px 0}
@media(max-width:640px){.library-controls,.auth-grid{grid-template-columns:1fr}.exercise-hero{float:none;max-width:100%}}
</style>

</head>

  if(action==="signup"){if(!email||password.length<6)throw new Error("Enter an email and a password of at least 6 characters.");var a=await supabaseClient.auth.signUp({email:email,password:password});if(a.error)throw a.error;msg=a.data.session?"Account created and signed in.":"Account created. Check your email to confirm it."}

  else if(action==="magic"){if(!email)throw new Error("Enter your email first.");var c=await supabaseClient.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.href.split("#")[0]}});if(c.error)throw c.error;msg="Magic link sent. Open it on this device."}
  else if(action==="signout"){var d=await supabaseClient.auth.signOut();if(d.error)throw d.error;msg="Signed out. Local cache remains on this device."}
  else if(action==="syncnow"){if(!currentSession)throw new Error("Sign in first.");syncBusy=true;setSyncStatus("Downloading latest Cloud data…");var changed=await (async function(){syncBusy=false;return pullRemote(true)})();msg=changed?"Downloaded the latest Cloud data.":"Cloud data checked; this device is already current."}
 }catch(e){msg=e.message||String(e)}render();
}
async function initSupabase(){
 if(!isSupabaseConfigured()||!window.supabase||!window.supabase.createClient){syncStatus="Supabase not configured · local cache only";render();return}
 try{supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);var r=await supabaseClient.auth.getSession();currentSession=r.data.session||null;
  supabaseClient.auth.onAuthStateChange(function(event,session){currentSession=session||null;if(!session){lastHandledUser="";if(rtChannel){supabaseClient.removeChannel(rtChannel);rtChannel=null}syncStatus="Signed out · local cache only";render()}else if(session.user.id!==lastHandledUser)setTimeout(function(){syncAfterLogin(session)},0)});
  if(currentSession)await syncAfterLogin(currentSession);else{syncStatus="Ready · sign in to sync devices";render()}
 }catch(e){syncStatus="Supabase initialization failed · local cache only";console.error(e);render()}
}

function settings(){
 var configured=isSupabaseConfigured(),jsReady=!!(window.supabase&&window.supabase.createClient),available=configured&&jsReady,signed=!!currentSession,email=signed?currentSession.user.email:"",disabled=available?'':' disabled';
 var warning=!configured?'<div class="knee"><b>ยังไม่ได้ตั้งค่า Supabase / Supabase is not configured.</b><br>กรุณาแทนค่า SUPABASE_URL และ SUPABASE_ANON_KEY ใน index.html แล้ว Deploy ใหม่ / Replace both placeholders in index.html and deploy again.</div>':(!jsReady?'<div class="knee"><b>โหลด supabase-js ไม่สำเร็จ / supabase-js failed to load.</b><br>ตรวจสอบอินเทอร์เน็ต, Content Security Policy และ CDN script แล้วรีเฟรชหน้า / Check the network, CSP and CDN script, then refresh.</div>':'');
 var login='<div class="auth-grid"><input id="auth-email" type="email" autocomplete="email" placeholder="Email"'+disabled+'><input id="auth-password" type="password" autocomplete="current-password" placeholder="Password (6+ characters)"'+disabled+'></div><div class="chips" style="margin-top:8px"><button class="btn" data-auth="signin"'+disabled+'>Sign in</button><button class="chip" data-auth="signup"'+disabled+'>Create account (email/password)</button><button class="chip" data-auth="magic"'+disabled+'>Email Magic Link</button></div>';
 var signedControls=signed?'<p><b>Signed in as:</b> '+esc(email)+'</p><div class="chips"><button class="chip on" data-auth="syncnow">Sync now (download Cloud)</button><button class="chip" data-auth="signout">Sign out</button></div>':'';
 return '<div class="top"><h1>Settings</h1></div><div class="card"><h2>Account / Login</h2><p><span class="sync-dot '+(signed?'on':'')+'"></span><b>Sync status:</b> '+esc(syncStatus)+'</p>'+warning+signedControls+(!signed?login:'')+'<p class="notice">ใช้บัญชี Supabase Auth อีเมลเดียวกันทุกอุปกรณ์ / Use the same Supabase Auth email on every device. This is not your GitHub login unless GitHub OAuth is separately enabled in Supabase.</p></div><div class="card"><h2>Appearance</h2><div class="chips"><button class="chip" data-theme="light">Light</button><button class="chip" data-theme="dark">Dark</button><button class="chip" data-theme="auto">Match device</button></div></div><div class="card"><h2>Backup / restore</h2><p style="color:var(--mute)">The app keeps an offline cache on this device. Copy this JSON for an extra backup.</p><textarea id="bk" rows="5" style="width:100%" aria-label="Backup JSON">'+esc(JSON.stringify(S))+'</textarea><div class="chips" style="margin-top:8px"><button class="chip" data-do="import:0">Restore from text</button><button class="chip" data-act="reset">Reset sample data</button></div></div>';
}




function render(){

 renderNav();

 var h={Dashboard:dash,Plan:plan,Library:library,Settings:settings,

 Session:session,

 Progress:progress,

 Nutrition:nutrition}[page];

 app.innerHTML=(msg?'<div class="knee" role="alert">'+esc(msg)+'</div>':"")+h();msg="";

}

function toggleTheme(){var dark=document.documentElement.getAttribute("data-theme")==="dark"||(!document.documentElement.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);setTheme(dark?"light":"dark")}

function setTheme(t){S.theme=t;if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);save()}

document.addEventListener("click",function(ev){

 var t=ev.target.closest("[data-nav],[data-range],[data-cat],[data-del],[data-add],[data-act],[data-theme],[data-do],[data-auth]");if(!t)return;

 var d=t.dataset;

 if(d.nav){page=d.nav;scrollTo(0,0)}

 else if(d.range)range=d.range;

 else if(d.cat)cat=d.cat;

 else if(d.del){var a=d.del.split(",");S.plan[a[0]].ex.splice(a[1],1);save()}

 else if(d.add){var picker=document.getElementById("pick-"+d.add),name=picker&&picker.value;if(name){S.plan[d.add].ex.push([name,2,"10–12"]);save()}else msg="Choose an exercise first."}

 else if(d.theme)setTheme(d.theme);else if(d.do)act(d.do);
 else if(d.auth){authAction(d.auth);return}
 else if(d.act==="theme")toggleTheme();
 else if(d.act==="refreshapi"){loadExerciseData(true);return}
 else if(d.act==="morelib"){libLimit+=80}
 else if(d.act==="reset"){if(confirm("Reset everything to the sample data?")){S=seed();migrate();save()}}

 render();

});

document.addEventListener("input",function(ev){if(ev.target.id==="lib-search"){libQuery=ev.target.value;libLimit=80;render()}});

document.addEventListener("change",function(ev){

 var t=ev.target;
 if(t.id==="lib-muscle"){libMuscle=t.value;libLimit=80;render();return}
 if(t.id==="lib-equipment"){libEquipment=t.value;libLimit=80;render();return}

 if(t.dataset.g){var gv=parseFloat(t.value);if(gv>0)S.goal[t.dataset.g]=gv;save();render();return}

 if(t.dataset.k){var e0=S.draft.ex[t.dataset.e],k0=t.dataset.k;

 if(k0==="note")e0.note=t.value;else if(k0==="easy")e0.easy=t.checked;

 else{var s0=e0.sets[t.dataset.s];if(k0==="done")s0.done=t.checked;else s0[k0]=Math.max(0,parseFloat(t.value)||0)}

 save();render();return}

 if(t.dataset.day!==undefined){S.plan[t.dataset.day].day=+t.value;save();return}

 if(t.dataset.f){var e=S.plan[t.dataset.i].ex[t.dataset.j],f=t.dataset.f;

 if(f==="n")e[0]=t.value||e[0];

 else if(f==="s"){var v=Math.max(1,Math.min(10,parseInt(t.value,10)||e[1]));e[1]=v;t.value=v}

 else e[2]=t.value.trim()||e[2];

 save()}

});

persistEnvelope();render();loadExerciseData(false);initSupabase();
document.addEventListener("visibilitychange",function(){if(!document.hidden)pullRemote(false)});
document.addEventListener("focusout",function(){if(pendingSafeRender)setTimeout(safeRender,0)});
window.addEventListener("focus",function(){pullRemote(false)});
setInterval(function(){pullRemote(false)},30000);

})();
